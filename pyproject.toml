[project]
name = "harness-maxxing-dokploy"
version = "1.8.0"
description = "Dokploy page extension and skill for Harness Maxxing"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]
